<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:B;src:url(boahmed.ttf)}html,body{margin:0}
.c{position:relative;width:1280px;height:720px;overflow:hidden;font-family:B;direction:rtl;
background:radial-gradient(ellipse at 22% 50%,rgba(249,196,69,.16),transparent 55%),linear-gradient(135deg,#14203a 0%,#101929 55%,#0b1220 100%)}
.f{position:absolute;inset:22px;border:2px solid rgba(206,162,57,.8);border-radius:26px}
.g{position:absolute;inset:0;background-image:linear-gradient(rgba(249,196,69,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(249,196,69,.05) 1px,transparent 1px);background-size:48px 48px}
.logo{position:absolute;left:110px;top:150px;height:420px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.k{position:absolute;right:100px;color:#F4F1E8}
.gold{background:linear-gradient(180deg,#FBD467,#CEA239);-webkit-background-clip:text;color:transparent}
.bar{position:absolute;right:100px;height:6px;border-radius:3px;background:linear-gradient(270deg,#F9C445,#CEA239 60%,transparent)}
.pill{position:absolute;right:100px;display:flex;gap:14px;direction:rtl}
.pill span{font-family:B;font-size:34px;color:#101929;background:linear-gradient(90deg,#F9C445,#CEA239);padding:6px 26px;border-radius:40px}</style></head><body><div class="c"><div class="g"></div><div class="f"></div>
<img class="logo" src="logo.png">
<div class="k" style="top:120px;font-size:56px;color:#CFD7E6">متجر</div>
<div class="k gold" style="top:190px;font-size:150px;line-height:1.15">قصي العميري</div>
<div class="bar" style="top:395px;width:560px"></div>
<div class="pill" style="top:440px"><span>محاضرات</span><span>امتحانات</span><span>ملازم</span></div>
<div class="k" style="top:545px;font-size:40px;color:#9fb0c9">الرياضيات · السادس الإعدادي</div>
</div></body></html>
