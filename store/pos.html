<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>بيع بالمكتب - QMath</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Boahmed;src:url(boahmed.ttf)}
:root{--ink:#101929;--ink2:#162238;--ink3:#1d2c47;--line:#2a3b5c;--gold:#F9C445;--gold2:#CEA239;--txt:#F4F1E8;--mut:#9fb0c9;--red:#ff7a6b;--ok:#6ee7a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--txt);font-family:Cairo,system-ui,sans-serif}
body{padding-bottom:110px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{position:relative;padding:22px 14px 18px;text-align:center;background:
 radial-gradient(ellipse at 50% 0%,rgba(249,196,69,.18),transparent 60%),linear-gradient(180deg,#14203a,var(--ink));border-bottom:1px solid var(--line)}
header img{height:92px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
header h1{font-family:Boahmed,Cairo;font-weight:400;font-size:30px;margin:6px 0 0;color:var(--gold)}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
.steps{display:flex;gap:8px;justify-content:center;margin:16px 0 4px}
.steps span{font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.steps span.on{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:18px;margin:16px 0;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.card h2{margin:0;padding:12px 16px;font-size:18px;font-weight:800;color:var(--ink);background:linear-gradient(90deg,var(--gold),var(--gold2));display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mut);font-weight:600;text-align:right;padding:8px 14px;background:var(--ink3)}
th.p,td.p{text-align:center;white-space:nowrap}
th.q,td.q{text-align:center;width:112px;padding-left:8px;padding-right:8px}
td{padding:11px 12px;line-height:1.45;border-top:1px solid var(--line);font-size:15px;vertical-align:middle}
tr.sel td{background:rgba(249,196,69,.09)}
td.p{color:var(--gold);font-weight:700}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:10px;border:1px solid var(--gold2);background:transparent;color:var(--gold);font-size:20px;line-height:1;font-family:inherit;cursor:pointer}
.qty button.add{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.qty b{min-width:18px;display:inline-block;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(16,25,41,.97);border-top:1px solid var(--gold2);padding:12px 14px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1}
.bar small{display:block;color:var(--mut);font-size:12px}
.bar strong{color:var(--gold);font-size:19px;white-space:nowrap}
.btn{border:0;border-radius:14px;padding:13px 16px;white-space:nowrap;font-family:inherit;font-size:16px;font-weight:800;background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold2)}
.form{padding:16px}
label{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px;font-weight:600}
label:first-child{margin-top:0}
input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--txt);font-family:inherit;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
input:disabled,select:disabled{opacity:.75;-webkit-text-fill-color:var(--txt)}
.seg button:disabled{cursor:default}.seg button:disabled:not(.on){opacity:.4}
input.ltr{direction:ltr;text-align:left;letter-spacing:1px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--txt);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.err{color:var(--red);font-size:13px;margin-top:5px;min-height:0}
.sumbox td{font-size:14px}
.sumbox tr.tot td{font-size:18px;font-weight:800;color:var(--gold);background:var(--ink3)}
.note{margin:14px 16px 16px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,122,107,.5);background:rgba(255,122,107,.08);font-size:14px;line-height:1.7}
.hide{display:none}
.warn{padding:14px 16px;border-color:var(--gold);background:rgba(249,196,69,.12);font-size:15px;line-height:1.8}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}
.who{padding:14px 16px;font-size:16px;line-height:1.8}.who b{color:var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 4px}
.chips button{border:1px solid var(--line);background:var(--ink);color:var(--txt);border-radius:99px;padding:7px 14px;font-family:inherit;font-size:14px;font-weight:700}
.chips button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="">
  <h1 style="font-family:Cairo;font-weight:800;letter-spacing:1px">QMath</h1>
  <p>🏪 بيع بالمكتب · بدون توصيل</p>
</header>
<div class="wrap">
  <div class="card"><h2>👤 الطالب</h2><div class="who" id="who"></div></div>
  <div class="chips" id="chips"></div>
  <section id="list"></section>
  <div class="card sumbox hide" id="sumCard"><h2>🧾 الفاتورة</h2><table id="sumT"></table></div>
</div>
<div class="bar"><div class="in">
  <div class="sum"><small>المجموع (بدون توصيل)</small><strong id="tot">0 د.ع</strong></div>
  <button class="btn" id="go" disabled>✅ تم البيع</button>
</div></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#101929'); tg.setBackgroundColor('#101929'); } catch (e) {} }
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('en-US') + ' د.ع';
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
function readData() {
  try {
    const d = new URLSearchParams(location.search).get('d');
    const b = atob(d.replace(/-/g, '+').replace(/_/g, '/'));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))));
  } catch (e) { return null; }
}
// D = {c: [[cat, [[id, name, price], ...]], ...], s: {id, n, p, g}}
const D = readData() || {c: [], s: {}};
const cart = {}, prod = {};
let cat = -1;
$('who').innerHTML = '<b>' + esc(D.s.n || '') + '</b><br>📞 ' + esc(D.s.p || '') + (D.s.g ? ' · ' + esc(D.s.g) : '');
$('chips').innerHTML = '<button data-i="-1" class="on">الكل</button>' + D.c.map((c, i) => `<button data-i="${i}">${esc(c[0])}</button>`).join('');
$('chips').querySelectorAll('button').forEach(b => b.onclick = () => {
  $('chips').querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); cat = +b.dataset.i; draw();
});
D.c.forEach(c => c[1].forEach(([id, n, p]) => prod[id] = [n, p]));
function draw() {
  $('list').innerHTML = D.c.map(([cname, items], i) => (cat >= 0 && cat !== i) ? '' : `
    <div class="card"><h2>📂 ${esc(cname)}</h2>
    <table><tr><th>المنتج</th><th class="p">السعر</th><th class="q">العدد</th></tr>
    ${items.map(([id, n, p]) => `
      <tr id="r${id}" class="${cart[id] ? 'sel' : ''}"><td>${esc(n)}</td><td class="p">${fmt(p)}</td>
      <td class="q"><span class="qty"><button onclick="chg(${id},-1)">−</button><b id="q${id}">${cart[id] || 0}</b><button class="add" onclick="chg(${id},1)">+</button></span></td></tr>`).join('')}
    </table></div>`).join('');
}
function chg(id, d) {
  cart[id] = Math.max(0, (cart[id] || 0) + d); if (!cart[id]) delete cart[id];
  const q = $('q' + id); if (q) q.textContent = cart[id] || 0;
  const r = $('r' + id); if (r) r.classList.toggle('sel', !!cart[id]);
  if (tg && tg.HapticFeedback) try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
  upd();
}
function total() { return Object.entries(cart).reduce((s, [id, q]) => s + prod[id][1] * q, 0); }
function upd() {
  const t = total(); $('tot').textContent = fmt(t); $('go').disabled = !t;
  const ent = Object.entries(cart);
  $('sumCard').classList.toggle('hide', !ent.length);
  $('sumT').innerHTML = '<tr><th>المنتج</th><th class="p">العدد</th><th class="p">السعر</th></tr>' +
    ent.map(([id, q]) => `<tr><td>${esc(prod[id][0])}</td><td class="p">${q}</td><td class="p">${fmt(prod[id][1] * q)}</td></tr>`).join('') +
    `<tr class="tot"><td colspan="2">💰 المجموع</td><td class="p">${fmt(t)}</td></tr>`;
}
$('go').onclick = () => {
  const o = {k: 'pos', sid: D.s.id, i: Object.entries(cart).map(([id, q]) => [+id, q]), t: total()};
  if (tg && tg.sendData) tg.sendData(JSON.stringify(o)); else alert(JSON.stringify(o));
};
draw(); upd();
</script>
</body>
</html>
