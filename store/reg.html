<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>التسجيل - QMath</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Boahmed;src:url(boahmed.ttf)}
:root{--ink:#101929;--ink2:#162238;--ink3:#1d2c47;--line:#2a3b5c;--gold:#F9C445;--gold2:#CEA239;--txt:#F4F1E8;--mut:#9fb0c9;--red:#ff7a6b;--ok:#6ee7a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--txt);font-family:Cairo,system-ui,sans-serif}
body{padding-bottom:110px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{position:relative;padding:22px 14px 18px;text-align:center;background:
 radial-gradient(ellipse at 50% 0%,rgba(249,196,69,.18),transparent 60%),linear-gradient(180deg,#14203a,var(--ink));border-bottom:1px solid var(--line)}
header img{height:92px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
header h1{font-family:Boahmed,Cairo;font-weight:400;font-size:30px;margin:6px 0 0;color:var(--gold)}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
.steps{display:flex;gap:8px;justify-content:center;margin:16px 0 4px}
.steps span{font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.steps span.on{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:18px;margin:16px 0;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.card h2{margin:0;padding:12px 16px;font-size:18px;font-weight:800;color:var(--ink);background:linear-gradient(90deg,var(--gold),var(--gold2));display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mut);font-weight:600;text-align:right;padding:8px 14px;background:var(--ink3)}
th.p,td.p{text-align:center;white-space:nowrap}
th.q,td.q{text-align:center;width:112px;padding-left:8px;padding-right:8px}
td{padding:11px 12px;line-height:1.45;border-top:1px solid var(--line);font-size:15px;vertical-align:middle}
tr.sel td{background:rgba(249,196,69,.09)}
td.p{color:var(--gold);font-weight:700}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:10px;border:1px solid var(--gold2);background:transparent;color:var(--gold);font-size:20px;line-height:1;font-family:inherit;cursor:pointer}
.qty button.add{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.qty b{min-width:18px;display:inline-block;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(16,25,41,.97);border-top:1px solid var(--gold2);padding:12px 14px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1}
.bar small{display:block;color:var(--mut);font-size:12px}
.bar strong{color:var(--gold);font-size:19px;white-space:nowrap}
.btn{border:0;border-radius:14px;padding:13px 16px;white-space:nowrap;font-family:inherit;font-size:16px;font-weight:800;background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold2)}
.form{padding:16px}
label{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px;font-weight:600}
label:first-child{margin-top:0}
input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--txt);font-family:inherit;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
input.ltr{direction:ltr;text-align:left;letter-spacing:1px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--ink);color:var(--txt);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.err{color:var(--red);font-size:13px;margin-top:5px;min-height:0}
.sumbox td{font-size:14px}
.sumbox tr.tot td{font-size:18px;font-weight:800;color:var(--gold);background:var(--ink3)}
.note{margin:14px 16px 16px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,122,107,.5);background:rgba(255,122,107,.08);font-size:14px;line-height:1.7}
.hide{display:none}
.warn{padding:14px 16px;border-color:var(--gold);background:rgba(249,196,69,.12);font-size:15px;line-height:1.8}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}
.seg.wrap2{flex-wrap:wrap}.seg.wrap2 button{flex:1 1 40%}
.lock{padding:12px 14px;border-radius:12px;border:1px dashed var(--gold2);background:rgba(249,196,69,.07);font-size:15px;line-height:1.8}
.lock small{display:block;color:var(--mut);font-size:12.5px}
.hint{color:var(--mut);font-size:12.5px;margin-top:4px}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="">
  <h1 style="font-family:Cairo;font-weight:800;letter-spacing:1px">QMath</h1>
  <p id="sub">التسجيل · مرة وحدة بس</p>
</header>

<div class="wrap">
  <div class="card">
    <h2>👤 معلومات الطالب</h2>
    <div class="form">
      <label>الاسم الرباعي</label>
      <input id="name" placeholder="بالعربي، مثال: علي حسن محمد كاظم" autocomplete="off">
      <div class="err" id="e_name"></div>

      <label>المنهج</label>
      <div class="seg" id="curr"><button data-v="عربي">عربي</button><button data-v="إنجليزي">إنجليزي</button></div>
      <div class="err" id="e_curr"></div>

      <label>إنت هذه السنة طالب بالمدرسة بأي صف؟</label>
      <div class="hint" style="margin:-2px 0 8px">اختار صفك الحقيقي بالمدرسة، حتى لو تدرس ويانا مادة السادس.</div>
      <div class="seg" id="grade"><button data-v="السادس العلمي">السادس العلمي</button><button data-v="الخامس العلمي">الخامس العلمي</button></div>
      <div class="err" id="e_grade"></div>
      <div id="gradeFixed" class="lock hide"></div>
    </div>
  </div>

  <div class="card">
    <h2>📍 السكن والهاتف</h2>
    <div class="form">
      <label>المحافظة</label>
      <select id="gov"><option value="">اختر المحافظة</option></select>
      <div class="err" id="e_gov"></div>

      <div id="sideBox" class="hide">
        <label>الجانب</label>
        <div class="seg" id="side"><button data-v="الرصافة">الرصافة</button><button data-v="الكرخ">الكرخ</button></div>
        <div class="err" id="e_side"></div>
      </div>

      <label>العنوان بالتفصيل</label>
      <input id="area" placeholder="المنطقة، المحلة، أقرب نقطة دالة" autocomplete="off">
      <div class="err" id="e_area"></div>

      <label>رقم الهاتف الأول (بالأرقام الإنجليزية)</label>
      <input id="ph1" class="ltr" inputmode="tel" maxlength="13" placeholder="07XXXXXXXXX" autocomplete="off">
      <div class="err" id="e_ph1"></div>

      <label>رقم الهاتف الثاني (بالأرقام الإنجليزية)</label>
      <input id="ph2" class="ltr" inputmode="tel" maxlength="13" placeholder="07XXXXXXXXX" autocomplete="off">
      <div class="err" id="e_ph2"></div>
    </div>
  </div>

  <div class="card" id="examCard">
    <h2>📝 الامتحانات</h2>
    <div class="form" id="examForm">
      <div id="examPick">
        <label>نوع الامتحان</label>
        <div class="seg" id="exam"><button data-v="حضوري">🏫 حضوري</button><button data-v="إلكتروني">💻 إلكتروني</button></div>
        <div class="err" id="e_exam"></div>
      </div>
      <div id="examFixed" class="lock hide"></div>
      <div id="cBox" class="hide">
        <label>منطقة المركز الامتحاني</label>
        <div class="seg wrap2" id="carea"></div>
        <div class="err" id="e_carea"></div>
        <div id="cenBox" class="hide">
          <label>المركز الامتحاني</label>
          <div class="seg wrap2" id="center"></div>
          <div class="err" id="e_center"></div>
        </div>
      </div>
      <div class="note" id="lockNote" style="margin:14px 0 0">⚠️ بعد الحفظ <b>ما تگدر تغير معلوماتك</b> إلا عن طريق الإدارة، فاكتبها صح.</div>
    </div>
  </div>
</div>

<div class="bar"><div class="in">
  <div class="sum"><small>راجع معلوماتك قبل الحفظ</small></div>
  <button class="btn" id="save">✅ حفظ معلوماتي</button>
</div></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#101929'); tg.setBackgroundColor('#101929'); } catch (e) {} }
const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
function readData() {
  try {
    const d = new URLSearchParams(location.search).get('d');
    const b = atob(d.replace(/-/g, '+').replace(/_/g, '/'));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0))));
  } catch (e) { return null; }
}
// D = {g: govs, m: modes, a: [[areaId, gov, areaName, [[cid, cname]]]], p: profile, x: locked exam}
const D = readData() || {g: [], m: [], a: []};
const V = {curr: '', grade: '', side: '', exam: '', carea: 0, center: 0};
const ADM = D.adm || 0;
const locked = !ADM && !!(D.x && D.x.e);
if (ADM) $('sub').textContent = 'تعديل معلومات طالب · الإدارة'; else if (D.p) $('sub').textContent = 'تعديل معلوماتك';

function segm(id, key, after) {
  $(id).querySelectorAll('button').forEach(b => b.onclick = () => {
    $(id).querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); V[key] = b.dataset.v; $('e_' + id).textContent = '';
    if (tg && tg.HapticFeedback) try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
    if (after) after();
  });
}
function pick(id, v) { const b = document.querySelector('#' + id + ' button[data-v="' + v + '"]'); if (b) b.click(); }
segm('curr', 'curr'); segm('grade', 'grade'); segm('side', 'side');
segm('exam', 'exam', () => { $('cBox').classList.toggle('hide', V.exam !== 'حضوري'); });

D.g.forEach(g => { const o = document.createElement('option'); o.value = g; o.textContent = g; $('gov').appendChild(o); });
function modeOf(g) { const i = D.g.indexOf(g); return i < 0 ? 'online' : (D.m[i] || 'online'); }
function areasFor(g) { const a = D.a.filter(x => x[1] === g); return a.length ? a : D.a; }

function drawAreas() {
  const g = $('gov').value, list = areasFor(g);
  V.carea = 0; V.center = 0; $('cenBox').classList.add('hide');
  $('carea').innerHTML = list.map(a => `<button data-v="${a[0]}">📍 ${esc(a[2])}${a[1] !== g ? ' (' + esc(a[1]) + ')' : ''}</button>`).join('');
  segm('carea', 'carea', drawCenters);
}
function drawCenters() {
  const a = D.a.find(x => String(x[0]) === String(V.carea));
  V.center = 0;
  $('center').innerHTML = (a ? a[3] : []).map(c => `<button data-v="${c[0]}">🏫 ${esc(c[1])}</button>`).join('');
  segm('center', 'center');
  $('cenBox').classList.remove('hide');
}
function onGov() {
  const g = $('gov').value;
  $('sideBox').classList.toggle('hide', g !== 'بغداد'); if (g !== 'بغداد') { V.side = ''; }
  if (locked) return;
  const m = ADM ? 'both' : modeOf(g);
  $('examCard').classList.toggle('hide', !g);
  $('examFixed').classList.add('hide'); $('examPick').classList.remove('hide');
  V.exam = ''; $('exam').querySelectorAll('button').forEach(x => x.classList.remove('on')); $('cBox').classList.add('hide');
  if (m === 'online') {
    V.exam = 'إلكتروني'; $('examPick').classList.add('hide');
    $('examFixed').innerHTML = '💻 امتحاناتك: <b>إلكترونية</b>'; $('examFixed').classList.remove('hide');
  } else if (m === 'in') {
    V.exam = 'حضوري'; $('examPick').classList.add('hide');
    $('examFixed').innerHTML = '🏫 امتحاناتك: <b>حضورية</b>'; $('examFixed').classList.remove('hide');
    $('cBox').classList.remove('hide');
  }
  drawAreas();
}
$('gov').onchange = () => { $('e_gov').textContent = ''; onGov(); };

if (!ADM && D.x && D.x.gr) {
  $('grade').classList.add('hide'); document.querySelector('#grade').previousElementSibling.classList.add('hide');
  $('gradeFixed').innerHTML = '🎓 صفك بالمدرسة: <b>' + esc(D.x.gr) + '</b> 🔒<small>لتغييره تواصل ويا قصي العميري.</small>';
  $('gradeFixed').classList.remove('hide'); V.grade = D.x.gr;
}
if (ADM) $('lockNote').classList.add('hide');
if (locked) {
  $('lockNote').classList.add('hide');
  $('examPick').classList.add('hide'); $('cBox').classList.add('hide');
  $('examFixed').innerHTML = (D.x.e === 'حضوري' ? '🏫' : '💻') + ' نوع الامتحان: <b>' + esc(D.x.e) + '</b> 🔒' +
    (D.x.c ? '<br>🏫 المركز: <b>' + esc(D.x.c) + '</b>' : '') + '<small>لتغييرهم تواصل ويا قصي العميري.</small>';
  $('examFixed').classList.remove('hide');
} else { $('examCard').classList.add('hide'); }

const AR = /[٠-٩۰-۹]/;
function phoneErr(v) {
  if (!v) return 'اكتب رقم الهاتف';
  if (AR.test(v)) return 'اكتب الرقم بالأرقام الإنجليزية مو العربية (مثل 07701234567)';
  if (!/^07\d{9}$/.test(v)) return 'الرقم لازم يكون 11 رقم ويبدأ بـ 07';
  return '';
}
['ph1', 'ph2'].forEach(id => $(id).addEventListener('input', () => { $('e_' + id).textContent = AR.test($(id).value) ? 'اكتب الرقم بالأرقام الإنجليزية مو العربية' : ''; }));

function validate() {
  const e = {}, name = $('name').value.trim().replace(/\s+/g, ' ');
  const words = name ? name.split(' ') : [];
  if (words.length < 4 || !words.every(w => /^[\u0621-\u0652\u0670-\u06D3]+$/.test(w))) e.name = 'اكتب اسمك الرباعي (أربع كلمات على الأقل) بالحروف العربية فقط';
  if (!V.curr) e.curr = 'اختر المنهج';
  if (!V.grade) e.grade = 'اختر صفك بالمدرسة';
  const g = $('gov').value;
  if (!g) e.gov = 'اختر المحافظة';
  if (g === 'بغداد' && !V.side) e.side = 'اختر الرصافة أو الكرخ';
  if ($('area').value.trim().length < 3) e.area = 'اكتب العنوان بالتفصيل';
  const p1 = $('ph1').value.replace(/[\s-]/g, ''), p2 = $('ph2').value.replace(/[\s-]/g, '');
  const a = phoneErr(p1), b = phoneErr(p2);
  if (a) e.ph1 = a;
  if (b) e.ph2 = b; else if (p1 === p2) e.ph2 = 'الرقم الثاني لازم يختلف عن الأول';
  if (!locked && g) {
    if (!V.exam) e.exam = 'اختر نوع الامتحان';
    else if (V.exam === 'حضوري' && D.a.length) {
      if (!V.carea) e.carea = 'اختر منطقة المركز';
      else if (!V.center) e.center = 'اختر المركز الامتحاني';
    }
  }
  ['name', 'curr', 'grade', 'gov', 'side', 'area', 'ph1', 'ph2', 'exam', 'carea', 'center'].forEach(k => { const el = $('e_' + k); if (el) el.textContent = e[k] || ''; });
  const first = Object.keys(e)[0];
  if (first) { $('e_' + first).scrollIntoView({behavior: 'smooth', block: 'center'}); return null; }
  return {k: 'reg', n: name, cu: V.curr, gr: V.grade, g, s: V.side, a: $('area').value.trim(), p1, p2,
          adm: ADM, e: locked ? '' : V.exam, c: (!locked && V.exam === 'حضوري') ? +V.center || 0 : 0};
}
$('save').onclick = () => {
  const f = validate(); if (!f) return;
  if (tg && tg.sendData) tg.sendData(JSON.stringify(f)); else alert(JSON.stringify(f));
};

if (D.p) {
  $('name').value = D.p.n || ''; pick('curr', D.p.cu); if (ADM || !(D.x && D.x.gr)) pick('grade', D.p.gr);
  if (D.p.g) { $('gov').value = D.p.g; $('sideBox').classList.toggle('hide', D.p.g !== 'بغداد'); if (!locked) onGov(); }
  pick('side', D.p.s);
  $('area').value = D.p.a || ''; $('ph1').value = D.p.p1 || ''; $('ph2').value = D.p.p2 || '';
  if (ADM && D.p.e) {
    pick('exam', D.p.e);
    if (D.p.e === 'حضوري' && D.p.c) {
      const a = D.a.find(x => x[3].some(c => c[0] === D.p.c));
      if (a) { pick('carea', String(a[0])); pick('center', String(D.p.c)); }
    }
  }
}
</script>
</body>
</html>
