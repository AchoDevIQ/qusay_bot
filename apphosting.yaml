# إعدادات Firebase App Hosting. الأسرار تنحفظ داخل Firebase، مو هنا:
#   firebase apphosting:secrets:set TOKEN
#   firebase apphosting:secrets:set WEBHOOK_SECRET
runConfig:
  # نسخة وحدة: البوت يرتب رسائل كل طالب بالذاكرة، ونسختين يخربن الترتيب
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  cpu: 2
  memoryMiB: 2048

env:
  - variable: TOKEN
    secret: TOKEN
    availability: [RUNTIME]
  # إشعارات المتصفح لأولياء الأمور (ببلاش): المفتاح السري بالخزنة، والعام مو سر
  - variable: VAPID_PRIVATE_KEY
    secret: VAPID_PRIVATE_KEY
    availability: [RUNTIME]
  # مفتاح الويب العام لمشروع التطبيق (qmath-iq): البوت يدخل بيه حساب الطالب الجديد اللي سجل بطريقة البوت
  - variable: APP_WEB_API_KEY
    value: "AIzaSyBDbCAr5_cdq_2Sam843s9IE_L6h-WVE0M"
    availability: [RUNTIME]
  - variable: VAPID_PUBLIC_KEY
    value: "BKKOaDnMGMn632seoXj-8E9_fbBMinuuAMqSk2PoYTRAWgCLTCWGLqmhOtZEhd2fTIP5S6uJYYfySvMQPmy3kK4"
    availability: [RUNTIME]
  - variable: WEBHOOK_SECRET
    secret: WEBHOOK_SECRET
    availability: [RUNTIME]
  # نظام التصحيح AI: خدمة Cloud Run خاصة (grading-ai)، ومفتاح القفل بينها وبين البوت سر بـ Secret Manager
  - variable: GRADING_AI_URL
    value: "https://qmath-grading-615405892644.europe-west4.run.app"
    availability: [RUNTIME]
  - variable: GRADING_AI_KEY
    secret: GRADING_AI_KEY
    availability: [RUNTIME]
  # مفتاح الذكاء للبوت نفسه («🧠 تصحيح قصي» والجواب الآلي للملازم). نفس مفتاح نظام مؤمل بـ Secret Manager
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability: [RUNTIME]
  # فحص خطوات الحل بالجبر قبل الحفظ: خطوة بيها قيمة ما تحقق المعادلة اللي قبلها ما تنحفظ
  - variable: AI_RUBRIC_CHECK
    value: "1"
    availability: [RUNTIME]
  # الورقة اللي نظام التصحيح AI مو متأكد من سؤال بيها تروح للمصحح المختار للفصل وما توصل للطالب قبل ما ينشوف
  # (قرار صاحب البوت 2026-11-07). بدونه، من تحديث Muammal 2026-11-13، الورقة توصل للطالب والمسؤول يتبلغ بس
  - variable: AI_HOLD_UNSURE
    value: "1"
    availability: [RUNTIME]
  - variable: ADMIN
    value: "7223248656"
    availability: [RUNTIME]
  - variable: STORE_URL
    value: "https://qusay-bot--qmath-v2.europe-west4.hosted.app"
    availability: [RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: "qmath-v2"
    availability: [RUNTIME]
  - variable: FIREBASE_STORAGE_BUCKET
    value: "qmath-v2.firebasestorage.app"
    availability: [RUNTIME]
  - variable: PDF_DIR
    value: "/tmp/qmath-pdf"
    availability: [RUNTIME]
  # السيرفر ما بيه مكتبات المتصفح (libnspr4 وغيرها). هذا يخلي @sparticuz/chromium يفك المكتبات اللي وياه
  - variable: AWS_LAMBDA_JS_RUNTIME
    value: "nodejs24.x"
    availability: [RUNTIME]
