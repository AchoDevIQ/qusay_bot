# إعدادات Firebase App Hosting. الأسرار تنحفظ داخل Firebase، مو هنا:
#   firebase apphosting:secrets:set TOKEN
#   firebase apphosting:secrets:set WEBHOOK_SECRET
runConfig:
  # نسخة وحدة: البوت يرتب رسائل كل طالب بالذاكرة، ونسختين يخربن الترتيب
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  cpu: 2
  memoryMiB: 2048

env:
  - variable: TOKEN
    secret: TOKEN
    availability: [RUNTIME]
  - variable: WEBHOOK_SECRET
    secret: WEBHOOK_SECRET
    availability: [RUNTIME]
  # نظام التصحيح AI: خدمة Cloud Run خاصة (grading-ai)، ومفتاح القفل بينها وبين البوت سر بـ Secret Manager
  - variable: GRADING_AI_URL
    value: "https://qmath-grading-615405892644.europe-west4.run.app"
    availability: [RUNTIME]
  - variable: GRADING_AI_KEY
    secret: GRADING_AI_KEY
    availability: [RUNTIME]
  - variable: ADMIN
    value: "7223248656"
    availability: [RUNTIME]
  - variable: STORE_URL
    value: "https://qusay-bot--qmath-v2.europe-west4.hosted.app"
    availability: [RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: "qmath-v2"
    availability: [RUNTIME]
  - variable: FIREBASE_STORAGE_BUCKET
    value: "qmath-v2.firebasestorage.app"
    availability: [RUNTIME]
  - variable: PDF_DIR
    value: "/tmp/qmath-pdf"
    availability: [RUNTIME]
  # السيرفر ما بيه مكتبات المتصفح (libnspr4 وغيرها). هذا يخلي @sparticuz/chromium يفك المكتبات اللي وياه
  - variable: AWS_LAMBDA_JS_RUNTIME
    value: "nodejs24.x"
    availability: [RUNTIME]
