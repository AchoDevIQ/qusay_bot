<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:B;src:url(boahmed.ttf)}html,body{margin:0}
.c{position:relative;width:1280px;height:720px;overflow:hidden;font-family:B;direction:rtl;
background:radial-gradient(ellipse at 22% 45%,rgba(59,130,246,.55),transparent 55%),radial-gradient(ellipse at 75% -10%,rgba(96,165,250,.45),transparent 60%),linear-gradient(160deg,#1e3a8a 0%,#14286b 50%,#0f1d40 100%)}
.f{position:absolute;inset:22px;border:2px solid rgba(147,197,253,.55);border-radius:26px}
.g{position:absolute;inset:0;background-image:linear-gradient(rgba(191,219,254,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(191,219,254,.07) 1px,transparent 1px);background-size:48px 48px}
.logo{position:absolute;left:110px;top:150px;height:420px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.k{position:absolute;right:100px;color:#F4F1E8}
.gold{color:#fff;text-shadow:0 4px 26px rgba(59,130,246,.85)}
.bar{position:absolute;right:100px;height:6px;border-radius:3px;background:linear-gradient(270deg,#93c5fd,#3b82f6 60%,transparent)}
.pill{position:absolute;right:100px;display:flex;gap:14px;direction:rtl}
.pill span{font-family:B;font-size:34px;color:#fff;background:linear-gradient(90deg,#3b82f6,#1d4ed8);border:2px solid rgba(191,219,254,.5);padding:6px 26px;border-radius:40px}
.ck{position:absolute;right:100px;top:110px;width:120px;height:120px;border-radius:50%;background:linear-gradient(180deg,#60a5fa,#1d4ed8);border:3px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:76px;color:#fff;font-family:Arial;font-weight:900;box-shadow:0 10px 30px rgba(59,130,246,.55)}
.box{position:absolute;right:100px;width:680px;border:2px solid rgba(255,122,107,.6);background:rgba(255,122,107,.08);border-radius:20px;padding:18px 26px;color:#F4F1E8;font-size:34px;line-height:1.5}
</style></head><body><div class="c"><div class="g"></div><div class="f"></div>
<img class="logo" src="logo.png" style="height:340px;top:130px;left:85px">
<div class="ck">✓</div>
<div class="k gold" style="top:250px;font-size:96px;line-height:1.2">تم استلام طلبك بنجاح</div>
<div class="bar" style="top:385px;width:600px"></div>
<div class="k" style="top:410px;font-size:44px">سيصلك الطلب خلال <span style="color:#bfdbfe">من <span style="font-family:Georgia">12</span> إلى <span style="font-family:Georgia">48</span> ساعة</span></div>
<div class="box" style="top:505px">للتذكير: جميع المشتريات غير قابلة للإرجاع إطلاقا ولأي سبب كان</div>
</div></body></html>
