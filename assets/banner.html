<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:B;src:url(boahmed.ttf)}html,body{margin:0}
.c{position:relative;width:1280px;height:720px;overflow:hidden;font-family:B;direction:rtl;
background:radial-gradient(ellipse at 22% 45%,rgba(59,130,246,.55),transparent 55%),radial-gradient(ellipse at 75% -10%,rgba(96,165,250,.45),transparent 60%),linear-gradient(160deg,#1e3a8a 0%,#14286b 50%,#0f1d40 100%)}
.f{position:absolute;inset:22px;border:2px solid rgba(147,197,253,.55);border-radius:26px}
.g{position:absolute;inset:0;background-image:linear-gradient(rgba(191,219,254,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(191,219,254,.07) 1px,transparent 1px);background-size:48px 48px}
.logo{position:absolute;left:110px;top:150px;height:420px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.k{position:absolute;right:100px;color:#F4F1E8}
.gold{color:#fff;text-shadow:0 4px 26px rgba(59,130,246,.85)}
.bar{position:absolute;right:100px;height:6px;border-radius:3px;background:linear-gradient(270deg,#93c5fd,#3b82f6 60%,transparent)}
.pill{position:absolute;right:100px;display:flex;gap:14px;direction:rtl}
.pill span{font-family:B;font-size:34px;color:#fff;background:linear-gradient(90deg,#3b82f6,#1d4ed8);border:2px solid rgba(191,219,254,.5);padding:6px 26px;border-radius:40px}</style></head><body><div class="c"><div class="g"></div><div class="f"></div>
<img class="logo" src="logo.png">
<div class="k gold" style="top:150px;font-size:160px;line-height:1.15">قصي العميري</div>
<div class="bar" style="top:385px;width:600px"></div>
<div class="pill" style="top:440px"><span>محاضرات</span><span>امتحانات</span><span>ملازم</span></div>
</div></body></html>
